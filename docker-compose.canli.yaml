# Postacı: test / canlı yayın için Docker Compose (Plesk veya başka bir sunucu).
#
# Upstream'in docker-compose.yaml dosyasından farkları:
#   - Kendi derlediğimiz imajı kullanır (POSTACI_IMAGE), upstream imajını DEĞİL.
#   - Parolalar ve anahtarlar koda gömülü değil, `.env.canli` dosyasından okunur (depoya girmez).
#   - Dışarıya yalnızca uygulama portu açılır ve yalnızca 127.0.0.1'e (ters vekil erişir).
#     Temporal (7233), Temporal arayüzü (8080) ve Spotlight (8969) dışarı AÇILMAZ.
#   - Spotlight (hata ayıklama aracı) ve temporal-admin-tools yok.
#
# Kullanım: YAYIN.md
#   docker compose -f docker-compose.canli.yaml --env-file .env.canli up -d

services:
  postaci:
    image: ${POSTACI_IMAGE:?POSTACI_IMAGE gerekli (derlediğiniz imaj adı)}
    container_name: postaci
    restart: always
    env_file:
      - .env.canli
    environment:
      DATABASE_URL: postgresql://postaci:${POSTGRES_PASSWORD:?}@postaci-postgres:5432/postaci
      REDIS_URL: redis://postaci-redis:6379
      BACKEND_INTERNAL_URL: http://localhost:3000
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: 'true'
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      NX_ADD_PLUGINS: 'false'
    volumes:
      - postaci-config:/config/
      - postaci-uploads:/uploads/
    ports:
      - '127.0.0.1:${POSTACI_PORT:-4007}:5000'
    networks:
      - postaci-network
      - temporal-network
    depends_on:
      postaci-postgres:
        condition: service_healthy
      postaci-redis:
        condition: service_healthy

  postaci-postgres:
    image: postgres:17-alpine
    container_name: postaci-postgres
    restart: always
    environment:
      POSTGRES_USER: postaci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: postaci
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - postaci-network
    healthcheck:
      test: pg_isready -U postaci -d postaci
      interval: 10s
      timeout: 3s
      retries: 3

  postaci-redis:
    image: redis:7.2
    container_name: postaci-redis
    restart: always
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - postaci-redis-data:/data
    networks:
      - postaci-network

  # -----------------------
  # Temporal (zamanlanmış paylaşımlar için arka plan iş akışları)
  # -----------------------
  temporal-elasticsearch:
    container_name: temporal-elasticsearch
    image: elasticsearch:7.17.27
    restart: always
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    networks:
      - temporal-network
    expose:
      - 9200
    volumes:
      - temporal-es-data:/usr/share/elasticsearch/data

  temporal-postgresql:
    container_name: temporal-postgresql
    image: postgres:16
    restart: always
    environment:
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:?}
      POSTGRES_USER: temporal
    networks:
      - temporal-network
    expose:
      - 5432
    volumes:
      - temporal-db-data:/var/lib/postgresql/data

  temporal:
    container_name: temporal
    image: temporalio/auto-setup:1.28.1
    restart: always
    depends_on:
      - temporal-postgresql
      - temporal-elasticsearch
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD:?}
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    networks:
      - temporal-network
    expose:
      - 7233
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig

volumes:
  postgres-volume:
  postaci-redis-data:
  postaci-config:
  postaci-uploads:
  temporal-es-data:
  temporal-db-data:

networks:
  postaci-network:
  temporal-network:
    name: temporal-network
